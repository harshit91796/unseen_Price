<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google does not support WebP favicons, so serve ICO + PNG -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="google-site-verification" content="uv10FbEReu7hV6055QbOuB-MFEmqIYBzUk8VCtda-O4" />
    
    <!-- Primary Meta Tags -->
    <title>Unseen Price - Discover Local Shops & Products Near You</title>
    <meta name="title" content="Unseen Price - Discover Local Shops & Products Near You" />
    <meta name="description" content="Find the best local shops and products in your area. Browse shops by category, compare prices, and discover hidden gems in your neighborhood. Shop local, support local businesses." />
    <meta name="keywords" content="local shops, nearby stores, shop finder, local products, neighborhood shopping, local businesses, shop discovery, price comparison, local marketplace" />
    <meta name="author" content="Unseen Price" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.unseenprice.com" />
    <meta property="og:title" content="Unseen Price - Discover Local Shops & Products Near You" />
    <meta property="og:description" content="Find the best local shops and products in your area. Browse shops by category, compare prices, and discover hidden gems in your neighborhood." />
    <meta property="og:image" content="https://www.unseenprice.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Unseen Price" />
    <meta property="og:site_name" content="Unseen Price" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.unseenprice.com" />
    <meta property="twitter:title" content="Unseen Price - Discover Local Shops & Products Near You" />
    <meta property="twitter:description" content="Find the best local shops and products in your area. Browse shops by category, compare prices, and discover hidden gems in your neighborhood." />
    <meta property="twitter:image" content="https://www.unseenprice.com/og-image.png" />
    <meta property="twitter:image:alt" content="Unseen Price" />
    
    <!-- Canonical URL: intentionally NOT set here. Every route serves this same
         file, so a fixed canonical would mark every page as a copy of the
         homepage. src/hooks/usePageMeta.ts injects the correct one per page. -->
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#007bff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Unseen Price" />
    
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDEdIDqcvE0Jb67t7i2FarDeZlMKwttovQ&libraries=places"></script>
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
